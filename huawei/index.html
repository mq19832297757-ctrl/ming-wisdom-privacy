<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="Privacy Policy for MING, an on-device Eastern wisdom and reflection app.">
  <title>MING Privacy Policy</title>
  <style>
    :root {
      --ink: #07100f;
      --panel: rgba(17, 37, 33, .92);
      --panel-soft: rgba(27, 54, 48, .72);
      --paper: #f0e8d9;
      --muted: #b8c7bd;
      --jade: #6fa391;
      --gold: #d5b878;
      --line: rgba(194, 213, 200, .22);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      color: var(--paper);
      background:
        radial-gradient(circle at 18% -10%, rgba(70, 121, 104, .38), transparent 38%),
        radial-gradient(circle at 90% 8%, rgba(165, 126, 68, .18), transparent 30%),
        linear-gradient(155deg, #06100e 0%, #0b1c18 54%, #040a09 100%);
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Arial, sans-serif;
      line-height: 1.7;
      min-height: 100vh;
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: .22;
      background-image: radial-gradient(rgba(231, 210, 158, .6) .6px, transparent .6px);
      background-size: 23px 23px;
      mask-image: linear-gradient(to bottom, #000, transparent 70%);
    }
    main { position: relative; max-width: 900px; margin: 0 auto; padding: 34px 18px 64px; }
    .language-bar { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 18px; }
    .language-bar button {
      appearance: none;
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 8px 13px;
      color: var(--muted);
      background: rgba(13, 35, 30, .72);
      cursor: pointer;
      font-weight: 700;
    }
    .language-bar button[aria-pressed="true"] { color: var(--ink); border-color: var(--gold); background: var(--gold); }
    article {
      border: 1px solid rgba(203, 183, 126, .34);
      border-radius: 26px;
      padding: clamp(22px, 5vw, 48px);
      background: linear-gradient(145deg, rgba(35, 61, 53, .94), rgba(5, 15, 13, .96));
      box-shadow: 0 28px 80px rgba(0, 0, 0, .45), inset 0 1px rgba(255, 255, 255, .08);
      backdrop-filter: blur(18px);
    }
    .eyebrow { color: var(--gold); font-size: 12px; font-weight: 800; letter-spacing: .18em; text-transform: uppercase; }
    h1 { margin: 8px 0 4px; font-family: Georgia, "Times New Roman", serif; font-weight: 500; font-size: clamp(38px, 8vw, 62px); line-height: 1.1; }
    .meta { color: var(--muted); margin: 4px 0; }
    .notice { margin: 24px 0 8px; padding: 16px 18px; border: 1px solid rgba(213, 184, 120, .35); border-left: 4px solid var(--gold); border-radius: 15px; background: rgba(72, 57, 31, .24); }
    section { margin-top: 30px; padding-top: 26px; border-top: 1px solid var(--line); }
    h2 { margin: 0 0 10px; font-family: Georgia, "Times New Roman", serif; font-weight: 500; color: #f1dfb1; font-size: 23px; }
    p, li { color: var(--muted); font-size: 16px; }
    ul { padding-left: 22px; }
    a { color: var(--gold); font-weight: 700; overflow-wrap: anywhere; }
    .footer { margin-top: 28px; color: #83988c; font-size: 13px; text-align: center; }
    @media (max-width: 520px) { main { padding: 18px 10px 40px; } article { border-radius: 20px; } }
  </style>
</head>
<body>
  <main>
    <nav class="language-bar" aria-label="Language">
      <button type="button" data-lang="en">English</button>
      <button type="button" data-lang="zh-Hans">简体中文</button>
      <button type="button" data-lang="zh-Hant">繁體中文</button>
      <button type="button" data-lang="fr">Français</button>
      <button type="button" data-lang="ko">한국어</button>
    </nav>
    <article id="policy" aria-live="polite"></article>
    <p class="footer">MING · See the pattern. Choose the path.</p>
  </main>
  <script>
    const email = '<a href="mailto:mengquan83@163.com">mengquan83@163.com</a>';
    const copy = {
      en: {
        title: 'Privacy Policy', app: 'MING: BaZi & Daily Fortune', developer: 'Developer: Hebei Xintilier Enterprise Management Consulting Co., Ltd.', date: 'Effective date: July 22, 2026 · Last updated: August 24, 2026 · Policy version: 2026-08-24-huawei-v2',
        notice: 'MING processes your entries on your device. The current app does not transmit personal data to the developer and does not use advertising, analytics, tracking, or third-party crash reporting.',
        sections: [
          ['1. Scope', '<p>This policy explains how MING handles information when you use BaZi, full Da Yun cycles, the I Ching, daily, seven-day, thirty-day, monthly and annual rhythms, date planning, relationship readings, the Eastern Guardian, the verification journal, archives, sharing, and the directional compass.</p>'],
          ['2. Information stored on your device', '<p>MING stores information that you choose to enter or save in app-private storage on your device:</p><ul><li>Birth date, birth time or “time unknown” choice, birthplace, time zone, day-boundary preference, and the Da Yun direction you select.</li><li>Names and birth details in saved personal and relationship profiles.</li><li>I Ching casting archives, selected inquiry context, interpretations, revisit dates, and reflection status.</li><li>Verification-journal dates, selected reflection results, and notes you choose to write.</li><li>Marked daily practices, Eastern Guardian progress and recent completion dates, language, background music, haptics, navigation preferences, and the accepted policy version.</li></ul><p>Charts, scores, readings, planning results, and Guardian results are calculated on your device. The bundled Guardian artwork does not collect biometric or image data.</p>'],
          ['3. No external collection or tracking', '<p>The current Android app has no Internet permission. MING does not upload the information above and does not use an account system, advertising SDK, analytics SDK, tracking technology, or third-party crash-reporting service. We do not sell or share app data.</p>'],
          ['4. Sensors and permissions', '<p>The directional compass processes the phone’s orientation-sensor readings in memory while the compass screen is visible. These readings are not saved or transmitted. MING does not request GPS location, microphone, camera, contacts, calendar, phone, SMS, or storage permission.</p><p>Background music is played from a file bundled with the app and does not use the microphone.</p>'],
          ['5. Paid download, sharing, and third parties', '<p>If you purchase MING through an app store, the store processes the transaction under its own terms and privacy policy. Hebei Xintilier Enterprise Management Consulting Co., Ltd. does not receive your payment-card or store-account credentials. Opening this policy uses your web browser and GitHub Pages; contacting support uses your chosen email provider, each under its own privacy terms.</p><p>When you choose Share, MING creates a card in its cache and hands it to the app you select through Android’s share sheet. A card may contain the result or Guardian artwork visible on the sharing screen. MING does not send the card itself; the selected service applies its own terms. Share cards exclude saved names and birth details by design.</p>'],
          ['Guardian Encounters, gallery images, and QR cards', '<p>Guardian Encounters and QR decoding are calculated offline. MING stores the encounter nickname, guardian form and level, random QR identifier and expiry, selected relationship context and purpose, and up to 20 recent encounter or returned-result records in app-private storage. An invitation QR cannot start a new encounter seven days after it is created, but completed results do not expire for that reason.</p><p>To read a Guardian QR from your gallery, Android’s system file picker lets you select one image. MING reads only that image and does not request broad photo-library or storage access. A saved card is written to Pictures/MING and remains there until you delete it. Invitation and returned-result QR cards contain no birth details.</p>'],
          ['6. Manual backup and restore', '<p>MING disables Android cloud backup and automatic device transfer. If you choose Export, MING creates a structured backup containing local profiles, records, Guardian progress, and settings, and lets you select the destination through Android’s system document picker. If you choose Import, MING reads only the backup file you select and validates its format before restoring it. MING does not upload these files. A cloud or storage provider you choose may process the file under its own privacy terms, so keep exported backups secure.</p>'],
          ['7. Retention and deletion', '<p>Profiles, casting archives, and verification-journal entries are not silently removed by a fixed item limit; they remain until you delete them, clear app storage, or uninstall MING. To prevent an ever-growing activity list, Guardian completion dates are kept for the most recent 35 days; an earned Guardian level remains until Guardian or app data is reset. The “Privacy & data” screen can delete local personal data. Language, sound, and privacy choices remain unless all app storage is cleared or MING is uninstalled.</p>'],
          ['8. Your choices and rights', '<p>You choose whether to enter birth or relationship information and which Da Yun direction to use. You can view, revise, export, import, or delete local data from the app. Because MING does not transmit this information to us, the developer holds no server-side copy to access or delete.</p>'],
          ['9. Cultural and decision notice', '<p>MING provides cultural interpretation, entertainment, and reflective guidance. It does not provide or replace medical diagnosis or treatment, legal advice, financial advice, mental-health care, emergency services, or guaranteed predictions. Lost-item and lost-pet guidance is not a substitute for contacting appropriate local services when safety is at risk.</p>'],
          ['10. Children’s privacy', '<p>MING is not specifically directed to children. The app does not knowingly transmit personal information from children or adults. Parents and guardians should decide whether the app’s reflective content is appropriate for a minor.</p>'],
          ['11. Security and international use', '<p>Local information is protected by Android’s app sandbox. No storage method is completely risk-free, so protect access to your device and any exported backup. MING may be downloaded in multiple countries, but the app does not operate a developer server or transfer app data across borders.</p>'],
          ['12. Changes to this policy', '<p>When app behavior or legal requirements change, this page will be updated with a new date and policy version. If a change materially affects in-app data handling, MING will ask you to review the updated policy again.</p>'],
          ['13. Contact', '<p>For privacy or support questions, contact Hebei Xintilier Enterprise Management Consulting Co., Ltd. at ' + email + '.</p>']
        ]
      },
      'zh-Hans': {
        title: '隐私政策', app: 'MING 命：八字与周易', developer: '开发者：河北辛缇莉儿企业管理咨询有限公司', date: '生效日期：2026年7月22日 · 更新日期：2026年8月24日 · 政策版本：2026-08-24-huawei-v2',
        notice: 'MING 在你的设备上处理你输入的资料。当前应用不会向开发者传输个人资料，也不使用广告、统计分析、追踪或第三方崩溃上报服务。',
        sections: [
          ['1. 适用范围', '<p>本政策说明你使用 MING 的八字、完整大运、周易、每日、七日、三十日、月度和年度节律、按目标择日、关系合盘、东方守护神兽、命运验证日记、档案、分享及方向罗盘时，应用如何处理相关资料。</p>'],
          ['2. 保存在设备上的资料', '<p>MING 会把你主动填写或保存的以下资料存入设备上的应用专属空间：</p><ul><li>出生日期、出生时间或“时辰未知”选择、出生地点、时区、换日规则和你选择的大运顺逆方式。</li><li>个人档案及关系档案中的称呼和出生资料。</li><li>易卦记录、所选问事情境、解读内容、回看日期和回看状态。</li><li>命运验证日记的日期、所选验证结果和你主动填写的备注。</li><li>标记的每日实践、守护神兽等级与近期完成日期、语言、背景音乐、触感、导航偏好和已同意的隐私政策版本。</li></ul><p>命盘、评分、解读、择日结果和守护神兽结果均在本机计算。应用内置的神兽图片不会收集生物识别或图像资料。</p>'],
          ['3. 不对外收集或追踪', '<p>当前 Android 应用没有网络权限。MING 不会上传上述资料，也不使用账号系统、广告 SDK、统计 SDK、追踪技术或第三方崩溃上报服务。我们不会出售或分享应用资料。</p>'],
          ['4. 传感器与权限', '<p>方向罗盘只在罗盘页面显示时，在内存中处理手机方向传感器读数；这些读数不会被保存或传输。MING 不申请 GPS 定位、麦克风、相机、通讯录、日历、电话、短信或存储权限。</p><p>背景音乐来自应用内置音频文件，不会使用麦克风。</p>'],
          ['5. 付费下载、主动分享与第三方', '<p>如果你通过应用商店购买 MING，交易由应用商店按照其条款和隐私政策处理。河北辛缇莉儿企业管理咨询有限公司不会取得你的银行卡资料或商店账号凭据。打开本政策会使用你的浏览器和 GitHub Pages；联系支持会使用你选择的邮件服务，分别适用其自身隐私规则。</p><p>当你主动选择“分享”时，MING 会在缓存中生成一张卡片，并通过 Android 系统分享面板交给你选定的应用。卡片可能包含分享页面显示的解读结果或守护神兽图片。MING 不会自行发送卡片；所选服务适用其自身条款。分享卡片在设计上不包含已保存的姓名和出生资料。</p>'],
          ['神兽相遇、相册图片与二维码卡片', '<p>神兽相遇和二维码识别均在本机离线计算。MING 会在应用专属空间保存相遇昵称、神兽形态与等级、二维码随机编号与有效期、所选关系场景与相遇目的，以及最近 20 条相遇或回赠结果记录。邀请二维码生成 7 天后不能再发起新相遇，但已完成结果不会因此失效。</p><p>从相册识别时，Android 系统文件选择器会让你明确选中一张图片；MING 只读取这张图片，不申请整个相册或存储空间的访问权限。保存的卡片会写入 Pictures/MING，并一直保留到你自行删除。邀请卡与回赠结果卡均不包含出生资料。</p>'],
          ['6. 手动备份与恢复', '<p>MING 已关闭 Android 云备份和自动换机迁移。只有你主动选择“导出”时，应用才会生成包含本地档案、记录、守护神兽进度和设置的结构化备份，并通过 Android 系统文件选择器让你决定保存位置。“导入”只读取你选中的备份文件，并先核验格式再恢复。MING 不会上传备份文件；如果你选择云盘或其他存储服务，该服务会按其自身隐私规则处理文件，请妥善保管导出的备份。</p>'],
          ['7. 保存期限与删除', '<p>人物档案、卦象记录和命运验证日记不会因固定数量上限被静默删除，会一直保留到你主动删除、清除应用存储或卸载应用。为避免行动记录无限堆积，守护神兽只保留最近35天的完成日期；已经获得的等级不会因此降低，除非你重置守护神兽或应用资料。“隐私与数据”页面可删除本地个人资料。语言、声音和隐私选择会保留到全部应用存储被清除或 MING 被卸载。</p>'],
          ['8. 你的选择和权利', '<p>是否填写出生或关系资料、采用哪一种大运顺逆方式，都由你决定。你可以在应用内查看、修改、导出、导入或删除本地资料。由于 MING 不会把这些资料传输给我们，开发者没有可供访问或删除的服务器副本。</p>'],
          ['9. 文化与决策说明', '<p>MING 提供东方文化解读、娱乐和自我反思参考，不提供或替代医疗诊断与治疗、法律意见、财务意见、心理健康服务、紧急服务或保证准确的预测。寻物和寻找宠物建议在存在安全风险时不能替代联系当地有关机构。</p>'],
          ['10. 儿童隐私', '<p>MING 并非专门面向儿童。应用不会有意传输儿童或成年人的个人资料。家长或监护人应自行判断其中的反思内容是否适合未成年人。</p>'],
          ['11. 安全与跨地区使用', '<p>本地资料受到 Android 应用沙箱保护。任何存储方式都并非绝对无风险，请妥善保护设备和导出备份的访问权限。MING 可以在多个国家下载，但应用不运行开发者服务器，也不会跨境传输应用资料。</p>'],
          ['12. 政策变更', '<p>应用行为或法律要求变化时，我们会更新本页面的日期和政策版本。如果变更实质影响应用内资料处理方式，MING 会再次请你查看更新后的政策。</p>'],
          ['13. 联系方式', '<p>如有隐私或支持问题，请通过 ' + email + ' 联系河北辛缇莉儿企业管理咨询有限公司。</p>']
        ]
      },
      'zh-Hant': {
        title: '隱私權政策', app: 'MING 命：八字與周易', developer: '開發者：Hebei Xintilier Enterprise Management Consulting Co., Ltd.', date: '生效日期：2026年7月22日 · 更新日期：2026年8月24日 · 政策版本：2026-08-24-huawei-v2',
        notice: 'MING 在你的裝置上處理你輸入的資料。目前的應用程式不會向開發者傳輸個人資料，也不使用廣告、統計分析、追蹤或第三方當機回報服務。',
        sections: [
          ['1. 適用範圍', '<p>本政策說明你使用 MING 的八字、完整大運、周易、每日、七日、三十日、月度與年度節律、按目標擇日、關係合盤、東方守護神獸、命運驗證日記、檔案、分享及方向羅盤時，應用程式如何處理相關資料。</p>'],
          ['2. 儲存在裝置上的資料', '<p>MING 會把你主動填寫或儲存的以下資料存入裝置上的應用程式專屬空間：</p><ul><li>出生日期、出生時間或「時辰未知」選擇、出生地點、時區、換日規則和你選擇的大運順逆方式。</li><li>個人檔案及關係檔案中的稱呼和出生資料。</li><li>易卦記錄、所選問事情境、解讀內容、回看日期和回看狀態。</li><li>命運驗證日記的日期、所選驗證結果和你主動填寫的備註。</li><li>標記的每日實踐、守護神獸等級與近期完成日期、語言、背景音樂、觸覺、導覽偏好和已同意的隱私政策版本。</li></ul><p>命盤、評分、解讀、擇日結果和守護神獸結果均在本機計算。應用程式內建的神獸圖片不會蒐集生物辨識或圖像資料。</p>'],
          ['3. 不對外蒐集或追蹤', '<p>目前的 Android 應用程式沒有網路權限。MING 不會上傳上述資料，也不使用帳號系統、廣告 SDK、統計 SDK、追蹤技術或第三方當機回報服務。我們不會出售或分享應用程式資料。</p>'],
          ['4. 感測器與權限', '<p>方向羅盤只在羅盤頁面顯示時，於記憶體中處理手機方向感測器讀數；這些讀數不會被儲存或傳輸。MING 不申請 GPS 定位、麥克風、相機、通訊錄、行事曆、電話、簡訊或儲存空間權限。</p><p>背景音樂來自應用程式內建音訊檔案，不會使用麥克風。</p>'],
          ['5. 付費下載、主動分享與第三方', '<p>如果你透過應用程式商店購買 MING，交易由應用程式商店依其條款和隱私政策處理。Hebei Xintilier Enterprise Management Consulting Co., Ltd. 不會取得你的信用卡資料或商店帳號憑證。開啟本政策會使用你的瀏覽器和 GitHub Pages；聯絡支援會使用你選擇的電子郵件服務，分別適用其自身隱私規則。</p><p>當你主動選擇「分享」時，MING 會在快取中產生一張卡片，並透過 Android 系統分享面板交給你選定的應用程式。卡片可能包含分享頁面顯示的解讀結果或守護神獸圖片。MING 不會自行傳送卡片；所選服務適用其自身條款。分享卡片在設計上不包含已儲存的姓名和出生資料。</p>'],
          ['神獸相遇、相簿圖片與 QR 卡片', '<p>神獸相遇和 QR 辨識均在本機離線計算。MING 會在應用程式專屬空間儲存相遇暱稱、神獸形態與等級、QR 隨機識別碼與有效期限、所選關係情境與相遇目的，以及最近 20 筆相遇或回贈結果紀錄。邀請 QR 產生 7 天後無法再發起新相遇，但已完成結果不會因此失效。</p><p>從相簿辨識時，Android 系統檔案選擇器會讓你明確選取一張圖片；MING 只讀取該圖片，不會要求存取整個相簿或儲存空間。儲存的卡片會寫入 Pictures/MING，並保留到你自行刪除。邀請卡與回贈結果卡均不包含出生資料。</p>'],
          ['6. 手動備份與還原', '<p>MING 已關閉 Android 雲端備份和自動換機移轉。只有你主動選擇「匯出」時，應用程式才會產生包含本機檔案、記錄、守護神獸進度和設定的結構化備份，並透過 Android 系統檔案選擇器讓你決定儲存位置。「匯入」只讀取你選取的備份檔案，並先驗證格式再還原。MING 不會上傳備份檔案；若你選擇雲端硬碟或其他儲存服務，該服務會依其自身隱私規則處理檔案，請妥善保管匯出的備份。</p>'],
          ['7. 保存期限與刪除', '<p>人物檔案、卦象記錄和命運驗證日記不會因固定數量上限被靜默刪除，會一直保留到你主動刪除、清除應用程式儲存空間或解除安裝。為避免行動記錄無限累積，守護神獸只保留最近35天的完成日期；已獲得的等級不會因此降低，除非你重設守護神獸或應用程式資料。「隱私與資料」頁面可刪除本機個人資料。語言、聲音和隱私選擇會保留到全部應用程式儲存空間被清除或 MING 被解除安裝。</p>'],
          ['8. 你的選擇與權利', '<p>是否填寫出生或關係資料、採用哪一種大運順逆方式，都由你決定。你可以在應用程式內查看、修改、匯出、匯入或刪除本機資料。由於 MING 不會把這些資料傳輸給我們，開發者沒有可供存取或刪除的伺服器副本。</p>'],
          ['9. 文化與決策說明', '<p>MING 提供東方文化解讀、娛樂和自我反思參考，不提供或取代醫療診斷與治療、法律意見、財務意見、心理健康服務、緊急服務或保證準確的預測。尋物和尋找寵物建議在存在安全風險時不能取代聯絡當地相關機構。</p>'],
          ['10. 兒童隱私', '<p>MING 並非專門面向兒童。應用程式不會有意傳輸兒童或成年人的個人資料。家長或監護人應自行判斷其中的反思內容是否適合未成年人。</p>'],
          ['11. 安全與跨地區使用', '<p>本機資料受到 Android 應用程式沙箱保護。任何儲存方式都並非絕對無風險，請妥善保護裝置和匯出備份的存取權限。MING 可以在多個國家下載，但應用程式不執行開發者伺服器，也不會跨境傳輸應用程式資料。</p>'],
          ['12. 政策變更', '<p>應用程式行為或法律要求變更時，我們會更新本頁面的日期和政策版本。如果變更實質影響應用程式內資料處理方式，MING 會再次請你查看更新後的政策。</p>'],
          ['13. 聯絡方式', '<p>如有隱私或支援問題，請透過 ' + email + ' 聯絡 Hebei Xintilier Enterprise Management Consulting Co., Ltd.。</p>']
        ]
      },
      fr: {
        title: 'Politique de confidentialité', app: 'MING : BaZi et horoscope du jour', developer: 'Développeur : Hebei Xintilier Enterprise Management Consulting Co., Ltd.', date: 'Entrée en vigueur : 22 juillet 2026 · Mise à jour : 24 août 2026 · Version : 2026-08-24-huawei-v2',
        notice: 'MING traite vos saisies sur votre appareil. L’application actuelle ne transmet aucune donnée personnelle au développeur et n’utilise ni publicité, ni analyse d’usage, ni suivi, ni service tiers de rapport d’incident.',
        sections: [
          ['1. Champ d’application', '<p>Cette politique décrit le traitement des informations lorsque vous utilisez le BaZi, les cycles complets de Da Yun, le Yi Jing, les rythmes quotidiens, sur sept et trente jours, mensuels et annuels, le choix de dates, les relations, le Gardien oriental, le journal de vérification, les archives, le partage et la boussole.</p>'],
          ['2. Informations conservées sur votre appareil', '<p>MING enregistre dans l’espace privé de l’application les informations que vous choisissez de saisir ou de conserver :</p><ul><li>Date, heure de naissance ou choix « heure inconnue », lieu, fuseau horaire, règle de changement de jour et sens du Da Yun choisi.</li><li>Noms et données de naissance des profils personnels et relationnels.</li><li>Archives de tirages du Yi Jing, contexte choisi, interprétations, dates de réexamen et état de réflexion.</li><li>Dates du journal de vérification, résultats sélectionnés et notes rédigées par vous.</li><li>Pratiques marquées, progression du Gardien et dates récentes, langue, musique, retour haptique, navigation et version de la politique acceptée.</li></ul><p>Les thèmes, scores, lectures, choix de dates et résultats du Gardien sont calculés sur votre appareil. Les illustrations intégrées ne collectent aucune donnée biométrique ou image.</p>'],
          ['3. Aucune collecte externe ni aucun suivi', '<p>L’application Android actuelle ne dispose pas de l’autorisation Internet. MING ne téléverse pas les informations ci-dessus et n’utilise ni compte, ni SDK publicitaire, ni SDK d’analyse, ni technologie de suivi, ni rapport d’incident tiers. Nous ne vendons ni ne partageons les données de l’application.</p>'],
          ['4. Capteurs et autorisations', '<p>La boussole traite en mémoire les mesures du capteur d’orientation uniquement lorsque son écran est visible. Ces mesures ne sont ni conservées ni transmises. MING ne demande aucun accès au GPS, au microphone, à la caméra, aux contacts, au calendrier, au téléphone, aux SMS ou au stockage.</p><p>La musique de fond provient d’un fichier inclus dans l’application et n’utilise pas le microphone.</p>'],
          ['5. Téléchargement payant, partage et tiers', '<p>Si vous achetez MING dans une boutique d’applications, celle-ci traite la transaction selon ses propres conditions et règles de confidentialité. Hebei Xintilier Enterprise Management Consulting Co., Ltd. ne reçoit ni vos données de carte ni vos identifiants de paiement. L’ouverture de cette politique utilise votre navigateur et GitHub Pages ; le contact avec l’assistance utilise votre fournisseur de messagerie, chacun selon ses propres règles.</p><p>Lorsque vous choisissez Partager, MING crée une carte dans son cache et la remet à l’application sélectionnée via la feuille de partage d’Android. Une carte peut contenir le résultat ou l’illustration du Gardien affiché sur l’écran de partage. MING n’envoie pas elle-même la carte ; le service choisi applique ses propres conditions. Par conception, les cartes partagées excluent les noms enregistrés et les données de naissance.</p>'],
          ['Rencontres des gardiens, galerie et cartes QR', '<p>Les rencontres et la lecture des QR sont calculées hors ligne. MING conserve dans l’espace privé de l’application le surnom de rencontre, la forme et le niveau du gardien, l’identifiant aléatoire et l’expiration du QR, le contexte et l’intention choisis, ainsi que les 20 derniers résultats de rencontre ou de réponse. Un QR d’invitation ne peut plus lancer de nouvelle rencontre sept jours après sa création, mais les résultats déjà créés ne disparaissent pas pour cette raison.</p><p>Pour lire un QR depuis la galerie, le sélecteur de fichiers Android vous laisse choisir une seule image. MING lit uniquement cette image et ne demande aucun accès général aux photos ou au stockage. Une carte enregistrée est écrite dans Pictures/MING et y reste jusqu’à sa suppression par vos soins. Les cartes d’invitation et de réponse ne contiennent aucune donnée de naissance.</p>'],
          ['6. Sauvegarde et restauration manuelles', '<p>MING désactive la sauvegarde Android dans le cloud et le transfert automatique entre appareils. Lorsque vous choisissez Exporter, MING crée une sauvegarde structurée des profils, archives, progression du Gardien et réglages locaux, puis vous laisse choisir sa destination avec le sélecteur de documents Android. Importer lit uniquement le fichier que vous sélectionnez et vérifie son format avant restauration. MING ne téléverse pas ces fichiers. Le fournisseur de stockage ou de cloud que vous choisissez applique sa propre politique ; protégez donc vos sauvegardes exportées.</p>'],
          ['7. Conservation et suppression', '<p>Les profils, tirages et entrées du journal ne sont pas supprimés silencieusement par une limite fixe. Ils restent jusqu’à leur suppression par vous, l’effacement du stockage ou la désinstallation. Pour éviter une liste sans fin, les dates d’actions du Gardien sont conservées pendant les 35 derniers jours ; le niveau acquis reste jusqu’à la réinitialisation du Gardien ou des données. L’écran « Confidentialité et données » permet de supprimer les données personnelles locales.</p>'],
          ['8. Vos choix et vos droits', '<p>Vous décidez de saisir ou non les informations de naissance ou de relation et du sens du Da Yun à utiliser. Vous pouvez consulter, modifier, exporter, importer ou supprimer les données locales. MING ne nous les transmettant pas, le développeur ne détient aucune copie sur serveur à consulter ou supprimer.</p>'],
          ['9. Avis culturel et décisionnel', '<p>MING propose une interprétation culturelle, un divertissement et des pistes de réflexion. L’application ne fournit ni ne remplace un diagnostic ou traitement médical, un conseil juridique ou financier, un soin psychologique, un service d’urgence ou une prédiction garantie. En cas de risque, les conseils concernant un objet ou un animal perdu ne remplacent pas les services locaux compétents.</p>'],
          ['10. Vie privée des enfants', '<p>MING ne s’adresse pas spécifiquement aux enfants. L’application ne transmet sciemment les informations personnelles ni des enfants ni des adultes. Il appartient aux parents ou responsables légaux d’évaluer si le contenu réflexif convient à un mineur.</p>'],
          ['11. Sécurité et utilisation internationale', '<p>Les informations locales sont protégées par le bac à sable d’Android. Aucune méthode de stockage n’est totalement sans risque : protégez l’accès à votre appareil et à toute sauvegarde exportée. MING peut être téléchargée dans plusieurs pays, mais l’application n’exploite aucun serveur du développeur et ne transfère pas de données d’application entre pays.</p>'],
          ['12. Modifications de cette politique', '<p>Lorsque le fonctionnement de l’application ou les exigences légales changent, cette page est mise à jour avec une nouvelle date et une nouvelle version. Si une modification affecte sensiblement le traitement des données, MING vous demandera de consulter à nouveau la politique.</p>'],
          ['13. Contact', '<p>Pour toute question de confidentialité ou d’assistance, contactez Hebei Xintilier Enterprise Management Consulting Co., Ltd. à l’adresse ' + email + '.</p>']
        ]
      },
      ko: {
        title: '개인정보처리방침', app: 'MING 사주 · 오늘의 운세', developer: '개발자: Hebei Xintilier Enterprise Management Consulting Co., Ltd.', date: '시행일: 2026년 7월 22일 · 업데이트: 2026년 8월 24일 · 정책 버전: 2026-08-24-huawei-v2',
        notice: 'MING은 사용자가 입력한 정보를 기기 안에서 처리합니다. 현재 앱은 개발자에게 개인정보를 전송하지 않으며 광고, 이용 분석, 추적, 제3자 오류 보고 서비스를 사용하지 않습니다.',
        sections: [
          ['1. 적용 범위', '<p>이 정책은 MING의 사주, 전체 대운, 주역, 오늘·7일·30일·월간·연간 흐름, 목적별 날짜 선택, 관계 궁합, 동방 수호 신수, 운세 검증 일지, 기록, 공유와 방향 나침반을 사용할 때 정보를 어떻게 처리하는지 설명합니다.</p>'],
          ['2. 기기에 저장되는 정보', '<p>MING은 사용자가 입력하거나 저장하기로 선택한 다음 정보를 기기의 앱 전용 저장 공간에 보관합니다.</p><ul><li>생년월일, 출생 시각 또는 “시각 모름” 선택, 출생지, 시간대, 날짜 변경 기준과 사용자가 선택한 대운 진행 방향.</li><li>개인 및 관계 프로필의 이름과 출생 정보.</li><li>주역 점괘 기록, 선택한 질문 맥락, 해석, 다시 볼 날짜와 검토 상태.</li><li>운세 검증 일지의 날짜, 선택한 검토 결과와 사용자가 직접 작성한 메모.</li><li>표시한 오늘의 실천, 수호 신수 등급과 최근 완료 날짜, 언어, 배경 음악, 진동, 화면 이동 설정과 동의한 정책 버전.</li></ul><p>명식, 점수, 해석, 날짜 선택과 수호 신수 결과는 기기 안에서 계산됩니다. 앱에 포함된 수호 신수 이미지는 생체 정보나 이미지 데이터를 수집하지 않습니다.</p>'],
          ['3. 외부 수집 및 추적 없음', '<p>현재 Android 앱에는 인터넷 권한이 없습니다. MING은 위 정보를 업로드하지 않으며 계정 시스템, 광고 SDK, 분석 SDK, 추적 기술, 제3자 오류 보고 서비스를 사용하지 않습니다. 앱 데이터를 판매하거나 공유하지 않습니다.</p>'],
          ['4. 센서와 권한', '<p>방향 나침반은 해당 화면이 보이는 동안에만 방향 센서 값을 메모리에서 처리합니다. 센서 값은 저장되거나 전송되지 않습니다. MING은 GPS 위치, 마이크, 카메라, 연락처, 캘린더, 전화, 문자, 저장 공간 권한을 요청하지 않습니다.</p><p>배경 음악은 앱에 포함된 음원 파일을 재생하며 마이크를 사용하지 않습니다.</p>'],
          ['5. 유료 다운로드, 공유와 제3자', '<p>앱 스토어에서 MING을 구매하면 스토어가 자체 약관과 개인정보 보호정책에 따라 결제를 처리합니다. Hebei Xintilier Enterprise Management Consulting Co., Ltd.는 카드 정보나 스토어 결제 계정 정보를 받지 않습니다. 이 정책을 열 때는 브라우저와 GitHub Pages를, 지원 문의에는 사용자가 선택한 이메일 서비스를 이용하며 각각 자체 개인정보 보호정책이 적용됩니다.</p><p>사용자가 공유를 선택하면 MING은 캐시에 카드를 만든 뒤 Android 공유 창을 통해 선택한 앱에 전달합니다. 카드는 공유 화면에 표시된 해석 결과나 수호 신수 이미지를 포함할 수 있습니다. MING이 카드를 직접 전송하지 않으며 선택한 서비스의 약관이 적용됩니다. 공유 카드에는 저장된 이름과 출생 정보가 포함되지 않도록 설계되어 있습니다.</p>'],
          ['수호신수 만남, 갤러리 이미지와 QR 카드', '<p>수호신수 만남과 QR 읽기는 기기 안에서 처리됩니다. MING은 앱 전용 저장 공간에 만남 별명, 수호신수 형태와 레벨, QR 무작위 식별값과 유효 기간, 선택한 관계 상황과 확인할 주제, 최근 만남 또는 답장 결과 최대 20개를 보관합니다. 초대 QR은 만든 지 7일이 지나면 새 만남을 시작할 수 없지만 이미 만든 결과는 사라지지 않습니다.</p><p>갤러리에서 QR을 읽을 때는 Android 시스템 파일 선택기에서 이미지 한 장을 직접 고릅니다. MING은 그 이미지 하나만 읽으며 전체 사진 보관함이나 저장 공간 접근 권한을 요청하지 않습니다. 저장한 카드는 Pictures/MING에 남으며 사용자가 직접 삭제해야 합니다. 초대 카드와 답장 결과 카드에는 출생 정보가 들어가지 않습니다.</p>'],
          ['6. 수동 백업과 복원', '<p>MING은 Android 클라우드 백업과 자동 기기 이전을 사용하지 않습니다. 사용자가 내보내기를 선택한 경우에만 로컬 프로필, 기록, 수호 신수 진행도와 설정이 담긴 구조화된 백업을 만들고 Android 시스템 문서 선택기로 저장 위치를 정하게 합니다. 가져오기는 사용자가 선택한 백업 파일만 읽고 형식을 확인한 뒤 복원합니다. MING은 이 파일을 업로드하지 않습니다. 선택한 클라우드 또는 저장 서비스에는 해당 서비스의 개인정보 보호정책이 적용되므로 내보낸 백업을 안전하게 보관하세요.</p>'],
          ['7. 보관과 삭제', '<p>인물 프로필, 점괘 기록과 운세 검증 일지는 고정 개수 제한 때문에 몰래 삭제되지 않으며 사용자가 삭제하거나 앱 저장 공간을 지우거나 앱을 제거할 때까지 남습니다. 기록이 끝없이 늘지 않도록 수호 신수 완료 날짜는 최근35일만 보관합니다. 이미 얻은 등급은 수호 신수 또는 앱 데이터를 초기화하기 전까지 유지됩니다. “개인정보와 데이터” 화면에서 로컬 개인정보를 삭제할 수 있습니다.</p>'],
          ['8. 사용자의 선택과 권리', '<p>출생·관계 정보를 입력할지와 사용할 대운 진행 방향은 사용자가 정합니다. 앱에서 로컬 데이터를 확인, 수정, 내보내기, 가져오기 또는 삭제할 수 있습니다. MING은 이 정보를 개발자에게 전송하지 않으므로 개발자가 열람하거나 삭제할 서버 사본도 없습니다.</p>'],
          ['9. 문화 및 의사결정 안내', '<p>MING은 문화적 해석, 오락, 성찰을 위한 안내를 제공합니다. 의료 진단·치료, 법률·재정 조언, 정신건강 관리, 응급 서비스 또는 결과가 보장된 예측을 제공하거나 대신하지 않습니다. 안전 위험이 있는 경우 분실물이나 반려동물 찾기 안내는 현지 관계 기관에 연락하는 일을 대신할 수 없습니다.</p>'],
          ['10. 아동의 개인정보', '<p>MING은 아동을 특별히 대상으로 하지 않습니다. 앱은 아동이나 성인의 개인정보를 의도적으로 전송하지 않습니다. 보호자는 성찰 콘텐츠가 미성년자에게 적합한지 판단해야 합니다.</p>'],
          ['11. 보안 및 국제적 이용', '<p>로컬 정보는 Android 앱 샌드박스로 보호됩니다. 완전히 위험이 없는 저장 방식은 없으므로 기기와 내보낸 백업 접근을 안전하게 관리하세요. MING은 여러 국가에서 다운로드할 수 있지만 개발자 서버를 운영하지 않으며 앱 데이터를 국가 간에 전송하지 않습니다.</p>'],
          ['12. 정책 변경', '<p>앱의 동작이나 법적 요구사항이 변경되면 이 페이지의 날짜와 정책 버전을 갱신합니다. 데이터 처리 방식에 중대한 변경이 생기면 MING이 갱신된 정책을 다시 확인하도록 요청합니다.</p>'],
          ['13. 문의', '<p>개인정보 또는 지원 관련 문의는 ' + email + '으로 Hebei Xintilier Enterprise Management Consulting Co., Ltd.에 연락해 주세요.</p>']
        ]
      }
    };

    function render(lang) {
      const selected = copy[lang] || copy.en;
      document.documentElement.lang = lang;
      document.title = selected.title + ' · MING';
      document.getElementById('policy').innerHTML =
        '<div class="eyebrow">MING · PRIVACY</div>' +
        '<h1>' + selected.title + '</h1>' +
        '<p class="meta">' + selected.app + '</p>' +
        '<p class="meta">' + selected.developer + '</p>' +
        '<p class="meta">' + selected.date + '</p>' +
        '<div class="notice">' + selected.notice + '</div>' +
        selected.sections.map(([title, body]) => '<section><h2>' + title + '</h2>' + body + '</section>').join('');
      document.querySelectorAll('[data-lang]').forEach(button => {
        button.setAttribute('aria-pressed', String(button.dataset.lang === lang));
      });
      localStorage.setItem('ming-privacy-language', lang);
    }

    document.querySelectorAll('[data-lang]').forEach(button => button.addEventListener('click', () => render(button.dataset.lang)));
    const browserLanguage = navigator.language || 'en';
    const automatic = browserLanguage.startsWith('zh') ? (browserLanguage.includes('TW') || browserLanguage.includes('HK') || browserLanguage.includes('Hant') ? 'zh-Hant' : 'zh-Hans') : browserLanguage.startsWith('fr') ? 'fr' : browserLanguage.startsWith('ko') ? 'ko' : 'en';
    render(localStorage.getItem('ming-privacy-language') || automatic);
  </script>
</body>

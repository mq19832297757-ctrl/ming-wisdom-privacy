<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="Privacy Policy for MING, an on-device Eastern wisdom and reflection app.">
  <title>MING Privacy Policy</title>
  <style>
    :root {
      --ink: #07100f;
      --panel: rgba(17, 37, 33, .92);
      --panel-soft: rgba(27, 54, 48, .72);
      --paper: #f0e8d9;
      --muted: #b8c7bd;
      --jade: #6fa391;
      --gold: #d5b878;
      --line: rgba(194, 213, 200, .22);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      color: var(--paper);
      background:
        radial-gradient(circle at 18% -10%, rgba(70, 121, 104, .38), transparent 38%),
        radial-gradient(circle at 90% 8%, rgba(165, 126, 68, .18), transparent 30%),
        linear-gradient(155deg, #06100e 0%, #0b1c18 54%, #040a09 100%);
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Arial, sans-serif;
      line-height: 1.7;
      min-height: 100vh;
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: .22;
      background-image: radial-gradient(rgba(231, 210, 158, .6) .6px, transparent .6px);
      background-size: 23px 23px;
      mask-image: linear-gradient(to bottom, #000, transparent 70%);
    }
    main { position: relative; max-width: 900px; margin: 0 auto; padding: 34px 18px 64px; }
    .language-bar { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 18px; }
    .language-bar button {
      appearance: none;
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 8px 13px;
      color: var(--muted);
      background: rgba(13, 35, 30, .72);
      cursor: pointer;
      font-weight: 700;
    }
    .language-bar button[aria-pressed="true"] { color: var(--ink); border-color: var(--gold); background: var(--gold); }
    article {
      border: 1px solid rgba(203, 183, 126, .34);
      border-radius: 26px;
      padding: clamp(22px, 5vw, 48px);
      background: linear-gradient(145deg, rgba(35, 61, 53, .94), rgba(5, 15, 13, .96));
      box-shadow: 0 28px 80px rgba(0, 0, 0, .45), inset 0 1px rgba(255, 255, 255, .08);
      backdrop-filter: blur(18px);
    }
    .eyebrow { color: var(--gold); font-size: 12px; font-weight: 800; letter-spacing: .18em; text-transform: uppercase; }
    h1 { margin: 8px 0 4px; font-family: Georgia, "Times New Roman", serif; font-weight: 500; font-size: clamp(38px, 8vw, 62px); line-height: 1.1; }
    .meta { color: var(--muted); margin: 4px 0; }
    .notice { margin: 24px 0 8px; padding: 16px 18px; border: 1px solid rgba(213, 184, 120, .35); border-left: 4px solid var(--gold); border-radius: 15px; background: rgba(72, 57, 31, .24); }
    section { margin-top: 30px; padding-top: 26px; border-top: 1px solid var(--line); }
    h2 { margin: 0 0 10px; font-family: Georgia, "Times New Roman", serif; font-weight: 500; color: #f1dfb1; font-size: 23px; }
    p, li { color: var(--muted); font-size: 16px; }
    ul { padding-left: 22px; }
    a { color: var(--gold); font-weight: 700; overflow-wrap: anywhere; }
    .footer { margin-top: 28px; color: #83988c; font-size: 13px; text-align: center; }
    @media (max-width: 520px) { main { padding: 18px 10px 40px; } article { border-radius: 20px; } }
  </style>
</head>
<body>
  <main>
    <nav class="language-bar" aria-label="Language">
      <button type="button" data-lang="en">English</button>
      <button type="button" data-lang="zh-Hans">简体中文</button>
      <button type="button" data-lang="zh-Hant">繁體中文</button>
      <button type="button" data-lang="fr">Français</button>
      <button type="button" data-lang="ko">한국어</button>
      <button type="button" data-lang="de">Deutsch</button>
      <button type="button" data-lang="ja">日本語</button>
    </nav>
    <article id="policy" aria-live="polite"></article>
    <p class="footer">MING · See the pattern. Choose the path.</p>
  </main>
  <script>
    const email = '<a href="mailto:mengquan83@163.com">mengquan83@163.com</a>';
    const copy = {
      en: {
        title: 'Privacy Policy', app: 'MING: BaZi & Daily Fortune', developer: 'Developer: MING Wisdom Studio', date: 'Effective date: July 22, 2026 · Last updated: September 4, 2026 · Policy version: 2026-09-04-samsung-v8',
        notice: 'MING processes your entries on your device. The current app does not transmit personal data to the developer and does not use advertising, analytics, tracking, or third-party crash reporting.',
        sections: [
          ['1. Scope', '<p>This policy explains how MING handles information when you use BaZi, full Da Yun cycles, the I Ching, daily, seven-day, thirty-day, monthly and annual rhythms, date planning, relationship readings, the Eastern Guardian, Guardian Encounters, the verification journal, archives, sharing, and the directional compass.</p>'],
          ['2. Information stored on your device', '<p>MING stores information that you choose to enter or save in app-private storage on your device:</p><ul><li>Birth date, birth time or “time unknown” choice, birthplace, time zone, day-boundary preference, and the Da Yun direction you select.</li><li>Names and birth details in saved personal and relationship profiles.</li><li>I Ching casting archives, selected inquiry context, interpretations, revisit dates, and reflection status.</li><li>Verification-journal dates, selected reflection results, and notes you choose to write.</li><li>Guardian Encounter nicknames, guardian form and level, random QR identifiers and expiry, selected relationship context and purpose, and up to 20 recent encounter or returned-result records.</li><li>Marked daily practices, Eastern Guardian progress and recent completion dates, language, background music, haptics, navigation preferences, and the accepted policy version.</li></ul><p>Charts, scores, readings, planning results, Guardian results, Guardian Encounters, and QR decoding are calculated on your device. The bundled Guardian artwork does not collect biometric or image data.</p>'],
          ['3. No external collection or tracking', '<p>The current Android app has no Internet permission. MING does not upload the information above and does not use an account system, advertising SDK, analytics SDK, tracking technology, or third-party crash-reporting service. We do not sell or share app data.</p>'],
          ['4. Sensors, photos, and permissions', '<p>The directional compass processes the phone’s orientation-sensor readings in memory while the compass screen is visible. These readings are not saved or transmitted. MING does not request GPS location, microphone, camera, contacts, calendar, phone, SMS, or broad photo-library or storage permission.</p><p>When you choose to read a Guardian QR from your gallery, Android’s system file picker lets you select one image. MING reads only that selected image and processes it offline. When you save a generated card, Android stores the PNG in Pictures/MING; that copy remains until you delete it.</p><p>Background music is played from a file bundled with the app and does not use the microphone.</p>'],
          ['5. Paid download, sharing, and third parties', '<p>If you purchase MING through an app store, the store processes the transaction under its own terms and privacy policy. MING Wisdom Studio does not receive your payment-card or store-account credentials. Opening this policy uses your web browser and GitHub Pages; contacting support uses your chosen email provider, each under its own privacy terms.</p><p>This page stores only your language choice in your browser’s local storage so the same language can be shown next time. This choice is not uploaded.</p><p>When you choose Share, MING creates a card in its cache and hands it to the app you select through Android’s share sheet. MING does not send the card itself; the selected service applies its own terms. Ordinary share cards exclude saved names and birth details by design. A Guardian invitation QR contains the encounter nickname, guardian form and level, expiry, and a random identifier. A returned-result QR also contains the relationship context and purpose selected by the recipient; it contains no birth details.</p>'],
          ['6. Manual backup and restore', '<p>MING disables Android cloud backup and automatic device transfer. If you choose Export, MING creates a structured backup containing local profiles, records, Guardian progress, and settings, and lets you select the destination through Android’s system document picker. If you choose Import, MING reads only the backup file you select and validates its format before restoring it. MING does not upload these files. A cloud or storage provider you choose may process the file under its own privacy terms, so keep exported backups secure.</p>'],
          ['7. Retention and deletion', '<p>Profiles, casting archives, and verification-journal entries are not silently removed by a fixed item limit; they remain until you delete them, clear app storage, or uninstall MING. Guardian Encounter records keep the most recent 20 items. An invitation QR cannot start a new encounter seven days after it is created, but completed results do not expire for that reason. To prevent an ever-growing activity list, Guardian completion dates are kept for the most recent 35 days; an earned Guardian level remains until Guardian or app data is reset. The “Privacy & data” screen can delete local personal data. Images saved to Pictures/MING are outside app-private storage and must be deleted from your gallery. Language, sound, and privacy choices remain unless all app storage is cleared or MING is uninstalled.</p>'],
          ['8. Your choices and rights', '<p>You choose whether to enter birth or relationship information and which Da Yun direction to use. You can view, revise, export, import, or delete local data from the app. Because MING does not transmit this information to us, the developer holds no server-side copy to access or delete.</p>'],
          ['9. Cultural and decision notice', '<p>MING provides cultural interpretation, entertainment, and reflective guidance. It does not provide or replace medical diagnosis or treatment, legal advice, financial advice, mental-health care, emergency services, or guaranteed predictions. Lost-item and lost-pet guidance is not a substitute for contacting appropriate local services when safety is at risk.</p>'],
          ['10. Children’s privacy', '<p>MING is not specifically directed to children. The app does not knowingly transmit personal information from children or adults. Parents and guardians should decide whether the app’s reflective content is appropriate for a minor.</p>'],
          ['11. Security and international use', '<p>Local information is protected by Android’s app sandbox. No storage method is completely risk-free, so protect access to your device and any exported backup. MING may be downloaded in multiple countries, but the app does not operate a developer server or transfer app data across borders.</p>'],
          ['12. Changes to this policy', '<p>When app behavior or legal requirements change, this page will be updated with a new date and policy version. If a change materially affects in-app data handling, MING will ask you to review the updated policy again.</p>'],
          ['13. Contact', '<p>For privacy or support questions, contact MING Wisdom Studio at ' + email + '.</p>']
        ]
      },
      'zh-Hans': {
        title: '隐私政策', app: 'MING：八字与周易', developer: '开发者：MING Wisdom Studio', date: '生效日期：2026年7月22日 · 更新日期：2026年9月4日 · 政策版本：2026-09-04-samsung-v8',
        notice: 'MING 在你的设备上处理你输入的资料。当前应用不会向开发者传输个人资料，也不使用广告、统计分析、追踪或第三方崩溃上报服务。',
        sections: [
          ['1. 适用范围', '<p>本政策说明你使用 MING 的八字、完整大运、周易、每日、七日、三十日、月度和年度节律、按目标择日、关系合盘、东方守护神兽、神兽相遇、命运验证日记、档案、分享及方向罗盘时，应用如何处理相关资料。</p>'],
          ['2. 保存在设备上的资料', '<p>MING 会把你主动填写或保存的以下资料存入设备上的应用专属空间：</p><ul><li>出生日期、出生时间或“时辰未知”选择、出生地点、时区、换日规则和你选择的大运顺逆方式。</li><li>个人档案及关系档案中的称呼和出生资料。</li><li>易卦记录、所选问事情境、解读内容、回看日期和回看状态。</li><li>命运验证日记的日期、所选验证结果和你主动填写的备注。</li><li>神兽相遇昵称、神兽形态与等级、二维码随机编号与有效期、所选关系场景与相遇目的，以及最近 20 条相遇或回赠结果记录。</li><li>标记的每日实践、守护神兽等级与近期完成日期、语言、背景音乐、触感、导航偏好和已同意的隐私政策版本。</li></ul><p>命盘、评分、解读、择日结果、守护神兽结果、神兽相遇和二维码识别均在本机计算。应用内置的神兽图片不会收集生物识别或图像资料。</p>'],
          ['3. 不对外收集或追踪', '<p>当前 Android 应用没有网络权限。MING 不会上传上述资料，也不使用账号系统、广告 SDK、统计 SDK、追踪技术或第三方崩溃上报服务。我们不会出售或分享应用资料。</p>'],
          ['4. 传感器、图片与权限', '<p>方向罗盘只在罗盘页面显示时，在内存中处理手机方向传感器读数；这些读数不会被保存或传输。MING 不申请 GPS 定位、麦克风、相机、通讯录、日历、电话、短信或整个相册与存储空间的访问权限。</p><p>当你从相册识别神兽二维码时，Android 系统文件选择器会让你明确选中一张图片；MING 只读取这张图片并在本机处理。保存生成的卡片时，Android 会把 PNG 写入 Pictures/MING；该副本会一直保留到你自行删除。</p><p>背景音乐来自应用内置音频文件，不会使用麦克风。</p>'],
          ['5. 付费下载、主动分享与第三方', '<p>如果你通过应用商店购买 MING，交易由应用商店按照其条款和隐私政策处理。MING Wisdom Studio 不会取得你的银行卡资料或商店账号凭据。打开本政策会使用你的浏览器和 GitHub Pages；联系支持会使用你选择的邮件服务，分别适用其自身隐私规则。</p><p>本页面只会在浏览器的本地存储中保存你的语言选择，以便下次打开时显示相同语言；该选择不会被上传。</p><p>当你主动选择“分享”时，MING 会在缓存中生成卡片，并通过 Android 系统分享面板交给你选定的应用。MING 不会自行发送卡片；所选服务适用其自身条款。普通分享卡不包含已保存的姓名和出生资料。神兽邀请二维码包含相遇昵称、神兽形态与等级、有效期和随机编号；回赠结果二维码还包含接收者选择的关系场景与相遇目的，但不包含出生资料。</p>'],
          ['6. 手动备份与恢复', '<p>MING 已关闭 Android 云备份和自动换机迁移。只有你主动选择“导出”时，应用才会生成包含本地档案、记录、守护神兽进度和设置的结构化备份，并通过 Android 系统文件选择器让你决定保存位置。“导入”只读取你选中的备份文件，并先核验格式再恢复。MING 不会上传备份文件；如果你选择云盘或其他存储服务，该服务会按其自身隐私规则处理文件，请妥善保管导出的备份。</p>'],
          ['7. 保存期限与删除', '<p>人物档案、卦象记录和命运验证日记不会因固定数量上限被静默删除，会一直保留到你主动删除、清除应用存储或卸载应用。神兽相遇最多保留最近 20 条记录；邀请二维码生成 7 天后不能再发起新相遇，但已完成结果不会因此失效。为避免行动记录无限堆积，守护神兽只保留最近 35 天的完成日期；已经获得的等级不会因此降低，除非你重置守护神兽或应用资料。“隐私与数据”页面可删除本地个人资料。保存到 Pictures/MING 的图片位于应用专属空间之外，需要你从相册自行删除。语言、声音和隐私选择会保留到全部应用存储被清除或 MING 被卸载。</p>'],
          ['8. 你的选择和权利', '<p>是否填写出生或关系资料、采用哪一种大运顺逆方式，都由你决定。你可以在应用内查看、修改、导出、导入或删除本地资料。由于 MING 不会把这些资料传输给我们，开发者没有可供访问或删除的服务器副本。</p>'],
          ['9. 文化与决策说明', '<p>MING 提供东方文化解读、娱乐和自我反思参考，不提供或替代医疗诊断与治疗、法律意见、财务意见、心理健康服务、紧急服务或保证准确的预测。寻物和寻找宠物建议在存在安全风险时不能替代联系当地有关机构。</p>'],
          ['10. 儿童隐私', '<p>MING 并非专门面向儿童。应用不会有意传输儿童或成年人的个人资料。家长或监护人应自行判断其中的反思内容是否适合未成年人。</p>'],
          ['11. 安全与跨地区使用', '<p>本地资料受到 Android 应用沙箱保护。任何存储方式都并非绝对无风险，请妥善保护设备和导出备份的访问权限。MING 可以在多个国家下载，但应用不运行开发者服务器，也不会跨境传输应用资料。</p>'],
          ['12. 政策变更', '<p>应用行为或法律要求变化时，我们会更新本页面的日期和政策版本。如果变更实质影响应用内资料处理方式，MING 会再次请你查看更新后的政策。</p>'],
          ['13. 联系方式', '<p>如有隐私或支持问题，请通过 ' + email + ' 联系 MING Wisdom Studio。</p>']
        ]
      },
      'zh-Hant': {
        title: '隱私權政策', app: 'MING：八字與周易', developer: '開發者：MING Wisdom Studio', date: '生效日期：2026年7月22日 · 更新日期：2026年9月4日 · 政策版本：2026-09-04-samsung-v8',
        notice: 'MING 在你的裝置上處理你輸入的資料。目前的應用程式不會向開發者傳輸個人資料，也不使用廣告、統計分析、追蹤或第三方當機回報服務。',
        sections: [
          ['1. 適用範圍', '<p>本政策說明你使用 MING 的八字、完整大運、周易、每日、七日、三十日、月度與年度節律、按目標擇日、關係合盤、東方守護神獸、神獸相遇、命運驗證日記、檔案、分享及方向羅盤時，應用程式如何處理相關資料。</p>'],
          ['2. 儲存在裝置上的資料', '<p>MING 會把你主動填寫或儲存的以下資料存入裝置上的應用程式專屬空間：</p><ul><li>出生日期、出生時間或「時辰未知」選擇、出生地點、時區、換日規則和你選擇的大運順逆方式。</li><li>個人檔案及關係檔案中的稱呼和出生資料。</li><li>易卦記錄、所選問事情境、解讀內容、回看日期和回看狀態。</li><li>命運驗證日記的日期、所選驗證結果和你主動填寫的備註。</li><li>神獸相遇暱稱、神獸形態與等級、QR 隨機識別碼與有效期限、所選關係情境與相遇目的，以及最近 20 筆相遇或回贈結果紀錄。</li><li>標記的每日實踐、守護神獸等級與近期完成日期、語言、背景音樂、觸覺、導覽偏好和已同意的隱私政策版本。</li></ul><p>命盤、評分、解讀、擇日結果、守護神獸結果、神獸相遇和 QR 辨識均在本機計算。應用程式內建的神獸圖片不會蒐集生物辨識或圖像資料。</p>'],
          ['3. 不對外蒐集或追蹤', '<p>目前的 Android 應用程式沒有網路權限。MING 不會上傳上述資料，也不使用帳號系統、廣告 SDK、統計 SDK、追蹤技術或第三方當機回報服務。我們不會出售或分享應用程式資料。</p>'],
          ['4. 感測器、圖片與權限', '<p>方向羅盤只在羅盤頁面顯示時，於記憶體中處理手機方向感測器讀數；這些讀數不會被儲存或傳輸。MING 不申請 GPS 定位、麥克風、相機、通訊錄、行事曆、電話、簡訊或整個相簿與儲存空間的存取權限。</p><p>當你從相簿辨識神獸 QR 時，Android 系統檔案選擇器會讓你明確選取一張圖片；MING 只讀取該圖片並在本機處理。儲存產生的卡片時，Android 會將 PNG 寫入 Pictures/MING；該副本會保留到你自行刪除。</p><p>背景音樂來自應用程式內建音訊檔案，不會使用麥克風。</p>'],
          ['5. 付費下載、主動分享與第三方', '<p>如果你透過應用程式商店購買 MING，交易由應用程式商店依其條款和隱私政策處理。MING Wisdom Studio 不會取得你的信用卡資料或商店帳號憑證。開啟本政策會使用你的瀏覽器和 GitHub Pages；聯絡支援會使用你選擇的電子郵件服務，分別適用其自身隱私規則。</p><p>本頁面只會在瀏覽器的本機儲存空間中保存你的語言選擇，以便下次開啟時顯示相同語言；該選擇不會被上傳。</p><p>當你主動選擇「分享」時，MING 會在快取中產生卡片，並透過 Android 系統分享面板交給你選定的應用程式。MING 不會自行傳送卡片；所選服務適用其自身條款。一般分享卡不包含已儲存的姓名和出生資料。神獸邀請 QR 包含相遇暱稱、神獸形態與等級、有效期限和隨機識別碼；回贈結果 QR 另包含接收者選擇的關係情境與相遇目的，但不包含出生資料。</p>'],
          ['6. 手動備份與還原', '<p>MING 已關閉 Android 雲端備份和自動換機移轉。只有你主動選擇「匯出」時，應用程式才會產生包含本機檔案、記錄、守護神獸進度和設定的結構化備份，並透過 Android 系統檔案選擇器讓你決定儲存位置。「匯入」只讀取你選取的備份檔案，並先驗證格式再還原。MING 不會上傳備份檔案；若你選擇雲端硬碟或其他儲存服務，該服務會依其自身隱私規則處理檔案，請妥善保管匯出的備份。</p>'],
          ['7. 保存期限與刪除', '<p>人物檔案、卦象記錄和命運驗證日記不會因固定數量上限被靜默刪除，會一直保留到你主動刪除、清除應用程式儲存空間或解除安裝。神獸相遇最多保留最近 20 筆紀錄；邀請 QR 產生 7 天後無法再發起新相遇，但已完成結果不會因此失效。為避免行動記錄無限累積，守護神獸只保留最近 35 天的完成日期；已獲得的等級不會因此降低，除非你重設守護神獸或應用程式資料。「隱私與資料」頁面可刪除本機個人資料。儲存到 Pictures/MING 的圖片位於應用程式專屬空間之外，須由你從相簿自行刪除。語言、聲音和隱私選擇會保留到全部應用程式儲存空間被清除或 MING 被解除安裝。</p>'],
          ['8. 你的選擇與權利', '<p>是否填寫出生或關係資料、採用哪一種大運順逆方式，都由你決定。你可以在應用程式內查看、修改、匯出、匯入或刪除本機資料。由於 MING 不會把這些資料傳輸給我們，開發者沒有可供存取或刪除的伺服器副本。</p>'],
          ['9. 文化與決策說明', '<p>MING 提供東方文化解讀、娛樂和自我反思參考，不提供或取代醫療診斷與治療、法律意見、財務意見、心理健康服務、緊急服務或保證準確的預測。尋物和尋找寵物建議在存在安全風險時不能取代聯絡當地相關機構。</p>'],
          ['10. 兒童隱私', '<p>MING 並非專門面向兒童。應用程式不會有意傳輸兒童或成年人的個人資料。家長或監護人應自行判斷其中的反思內容是否適合未成年人。</p>'],
          ['11. 安全與跨地區使用', '<p>本機資料受到 Android 應用程式沙箱保護。任何儲存方式都並非絕對無風險，請妥善保護裝置和匯出備份的存取權限。MING 可以在多個國家下載，但應用程式不執行開發者伺服器，也不會跨境傳輸應用程式資料。</p>'],
          ['12. 政策變更', '<p>應用程式行為或法律要求變更時，我們會更新本頁面的日期和政策版本。如果變更實質影響應用程式內資料處理方式，MING 會再次請你查看更新後的政策。</p>'],
          ['13. 聯絡方式', '<p>如有隱私或支援問題，請透過 ' + email + ' 聯絡 MING Wisdom Studio。</p>']
        ]
      },
      fr: {
        title: 'Politique de confidentialité', app: 'MING : BaZi et horoscope du jour', developer: 'Développeur : MING Wisdom Studio', date: 'Entrée en vigueur : 22 juillet 2026 · Mise à jour : 4 septembre 2026 · Version : 2026-09-04-samsung-v8',
        notice: 'MING traite vos saisies sur votre appareil. L’application actuelle ne transmet aucune donnée personnelle au développeur et n’utilise ni publicité, ni analyse d’usage, ni suivi, ni service tiers de rapport d’incident.',
        sections: [
          ['1. Champ d’application', '<p>Cette politique décrit le traitement des informations lorsque vous utilisez le BaZi, les cycles complets de Da Yun, le Yi Jing, les rythmes quotidiens, sur sept et trente jours, mensuels et annuels, le choix de dates, les relations, le Gardien oriental, les rencontres des gardiens, le journal de vérification, les archives, le partage et la boussole.</p>'],
          ['2. Informations conservées sur votre appareil', '<p>MING enregistre dans l’espace privé de l’application les informations que vous choisissez de saisir ou de conserver :</p><ul><li>Date, heure de naissance ou choix « heure inconnue », lieu, fuseau horaire, règle de changement de jour et sens du Da Yun choisi.</li><li>Noms et données de naissance des profils personnels et relationnels.</li><li>Archives de tirages du Yi Jing, contexte choisi, interprétations, dates de réexamen et état de réflexion.</li><li>Dates du journal de vérification, résultats sélectionnés et notes rédigées par vous.</li><li>Surnom de rencontre, forme et niveau du gardien, identifiant aléatoire et expiration du QR, contexte et intention choisis, ainsi que les 20 derniers résultats de rencontre ou de réponse.</li><li>Pratiques marquées, progression du Gardien et dates récentes, langue, musique, retour haptique, navigation et version de la politique acceptée.</li></ul><p>Les thèmes, scores, lectures, choix de dates, résultats du Gardien, rencontres et lecture des QR sont calculés sur votre appareil. Les illustrations intégrées ne collectent aucune donnée biométrique ou image.</p>'],
          ['3. Aucune collecte externe ni aucun suivi', '<p>L’application Android actuelle ne dispose pas de l’autorisation Internet. MING ne téléverse pas les informations ci-dessus et n’utilise ni compte, ni SDK publicitaire, ni SDK d’analyse, ni technologie de suivi, ni rapport d’incident tiers. Nous ne vendons ni ne partageons les données de l’application.</p>'],
          ['4. Capteurs, photos et autorisations', '<p>La boussole traite en mémoire les mesures du capteur d’orientation uniquement lorsque son écran est visible. Ces mesures ne sont ni conservées ni transmises. MING ne demande aucun accès au GPS, au microphone, à la caméra, aux contacts, au calendrier, au téléphone, aux SMS, ni un accès général aux photos ou au stockage.</p><p>Pour lire un QR gardien depuis la galerie, le sélecteur de fichiers Android vous laisse choisir une seule image. MING lit uniquement cette image et la traite hors ligne. Une carte enregistrée est écrite par Android dans Pictures/MING et y reste jusqu’à sa suppression par vos soins.</p><p>La musique de fond provient d’un fichier inclus dans l’application et n’utilise pas le microphone.</p>'],
          ['5. Téléchargement payant, partage et tiers', '<p>Si vous achetez MING dans une boutique d’applications, celle-ci traite la transaction selon ses propres conditions et règles de confidentialité. MING Wisdom Studio ne reçoit ni vos données de carte bancaire ni les identifiants de votre compte sur la boutique d’applications. L’ouverture de cette politique utilise votre navigateur et GitHub Pages ; le contact avec l’assistance utilise votre fournisseur de messagerie, chacun selon ses propres règles.</p><p>Cette page enregistre uniquement votre choix de langue dans le stockage local de votre navigateur afin d’afficher la même langue lors de votre prochaine visite ; ce choix n’est pas téléversé.</p><p>Lorsque vous choisissez Partager, MING crée une carte dans son cache et la remet à l’application sélectionnée via la feuille de partage d’Android. MING n’envoie pas elle-même la carte ; le service choisi applique ses propres conditions. Les cartes ordinaires excluent les noms enregistrés et les données de naissance. Un QR d’invitation contient le surnom de rencontre, la forme et le niveau du gardien, l’expiration et un identifiant aléatoire. Un QR de réponse ajoute le contexte relationnel et l’intention choisis par le destinataire, sans données de naissance.</p>'],
          ['6. Sauvegarde et restauration manuelles', '<p>MING désactive la sauvegarde Android dans le cloud et le transfert automatique entre appareils. Lorsque vous choisissez Exporter, MING crée une sauvegarde structurée des profils, archives, progression du Gardien et réglages locaux, puis vous laisse choisir sa destination avec le sélecteur de documents Android. Importer lit uniquement le fichier que vous sélectionnez et vérifie son format avant restauration. MING ne téléverse pas ces fichiers. Le fournisseur de stockage ou de cloud que vous choisissez applique sa propre politique ; protégez donc vos sauvegardes exportées.</p>'],
          ['7. Conservation et suppression', '<p>Les profils, tirages et entrées du journal ne sont pas supprimés silencieusement par une limite fixe. Ils restent jusqu’à leur suppression par vous, l’effacement du stockage ou la désinstallation. Les rencontres conservent les 20 éléments les plus récents. Un QR d’invitation ne peut plus lancer de nouvelle rencontre sept jours après sa création, mais les résultats déjà créés ne disparaissent pas pour cette raison. Pour éviter une liste sans fin, les dates d’actions du Gardien sont conservées pendant les 35 derniers jours ; le niveau acquis reste jusqu’à la réinitialisation du Gardien ou des données. L’écran « Confidentialité et données » permet de supprimer les données personnelles locales. Les images enregistrées dans Pictures/MING se trouvent hors de l’espace privé de l’application et doivent être supprimées depuis la galerie. Les préférences de langue, de son et de confidentialité sont conservées jusqu’à l’effacement complet des données de l’application ou la désinstallation de MING.</p>'],
          ['8. Vos choix et vos droits', '<p>Vous décidez de saisir ou non les informations de naissance ou de relation et du sens du Da Yun à utiliser. Vous pouvez consulter, modifier, exporter, importer ou supprimer les données locales. MING ne nous les transmettant pas, le développeur ne détient aucune copie sur serveur à consulter ou supprimer.</p>'],
          ['9. Avis culturel et décisionnel', '<p>MING propose une interprétation culturelle, un divertissement et des pistes de réflexion. L’application ne fournit ni ne remplace un diagnostic ou traitement médical, un conseil juridique ou financier, un soin psychologique, un service d’urgence ou une prédiction garantie. En cas de risque, les conseils concernant un objet ou un animal perdu ne remplacent pas les services locaux compétents.</p>'],
          ['10. Vie privée des enfants', '<p>MING ne s’adresse pas spécifiquement aux enfants. L’application ne transmet sciemment les informations personnelles ni des enfants ni des adultes. Il appartient aux parents ou responsables légaux d’évaluer si le contenu réflexif convient à un mineur.</p>'],
          ['11. Sécurité et utilisation internationale', '<p>Les informations locales sont protégées par le bac à sable d’Android. Aucune méthode de stockage n’est totalement sans risque : protégez l’accès à votre appareil et à toute sauvegarde exportée. MING peut être téléchargée dans plusieurs pays, mais l’application n’exploite aucun serveur du développeur et ne transfère pas de données d’application entre pays.</p>'],
          ['12. Modifications de cette politique', '<p>Lorsque le fonctionnement de l’application ou les exigences légales changent, cette page est mise à jour avec une nouvelle date et une nouvelle version. Si une modification affecte sensiblement le traitement des données, MING vous demandera de consulter à nouveau la politique.</p>'],
          ['13. Contact', '<p>Pour toute question de confidentialité ou d’assistance, contactez MING Wisdom Studio à l’adresse ' + email + '.</p>']
        ]
      },
      ko: {
        title: '개인정보처리방침', app: 'MING 사주 오늘의 운세', developer: '개발자: MING Wisdom Studio', date: '시행일: 2026년 7월 22일 · 업데이트: 2026년 9월 4일 · 정책 버전: 2026-09-04-samsung-v8',
        notice: 'MING은 사용자가 입력한 정보를 기기 안에서 처리합니다. 현재 앱은 개발자에게 개인정보를 전송하지 않으며 광고, 이용 분석, 추적, 제3자 오류 보고 서비스를 사용하지 않습니다.',
        sections: [
          ['1. 적용 범위', '<p>이 정책은 MING의 사주, 전체 대운, 주역, 오늘·7일·30일·월간·연간 흐름, 목적별 날짜 선택, 관계 궁합, 동방 수호신수, 수호신수 만남, 운세 검증 일지, 기록, 공유와 방향 나침반을 사용할 때 정보를 어떻게 처리하는지 설명합니다.</p>'],
          ['2. 기기에 저장되는 정보', '<p>MING은 사용자가 입력하거나 저장하기로 선택한 다음 정보를 기기의 앱 전용 저장 공간에 보관합니다.</p><ul><li>생년월일, 출생 시각 또는 “시각 모름” 선택, 출생지, 시간대, 날짜 변경 기준과 사용자가 선택한 대운 진행 방향.</li><li>개인 및 관계 프로필의 이름과 출생 정보.</li><li>주역 점괘 기록, 선택한 질문 맥락, 해석, 다시 볼 날짜와 검토 상태.</li><li>운세 검증 일지의 날짜, 선택한 검토 결과와 사용자가 직접 작성한 메모.</li><li>만남 별명, 수호신수 형태와 레벨, QR 무작위 식별값과 유효 기간, 선택한 관계 상황과 확인할 주제, 최근 만남 또는 답장 결과 최대 20개.</li><li>표시한 오늘의 실천, 수호신수 등급과 최근 완료 날짜, 언어, 배경 음악, 진동, 화면 이동 설정과 동의한 정책 버전.</li></ul><p>명식, 점수, 해석, 날짜 선택, 수호신수 결과, 수호신수 만남과 QR 읽기는 모두 기기 안에서 처리됩니다. 앱에 포함된 수호신수 이미지는 생체 정보나 이미지 데이터를 수집하지 않습니다.</p>'],
          ['3. 외부 수집 및 추적 없음', '<p>현재 Android 앱에는 인터넷 권한이 없습니다. MING은 위 정보를 업로드하지 않으며 계정 시스템, 광고 SDK, 분석 SDK, 추적 기술, 제3자 오류 보고 서비스를 사용하지 않습니다. 앱 데이터를 판매하거나 공유하지 않습니다.</p>'],
          ['4. 센서, 사진과 권한', '<p>방향 나침반은 해당 화면이 보이는 동안에만 방향 센서 값을 메모리에서 처리합니다. 센서 값은 저장되거나 전송되지 않습니다. MING은 GPS 위치, 마이크, 카메라, 연락처, 캘린더, 전화, 문자 또는 전체 사진 보관함과 저장 공간 접근 권한을 요청하지 않습니다.</p><p>갤러리에서 수호신수 QR을 읽을 때는 Android 시스템 파일 선택기에서 이미지 한 장을 직접 고릅니다. MING은 그 이미지 하나만 기기 안에서 처리합니다. 생성한 카드를 저장하면 Android가 PNG 파일을 Pictures/MING에 기록하며, 사용자가 직접 삭제할 때까지 남습니다.</p><p>배경 음악은 앱에 포함된 음원 파일을 재생하며 마이크를 사용하지 않습니다.</p>'],
          ['5. 유료 다운로드, 공유와 제3자', '<p>앱 스토어에서 MING을 구매하면 스토어가 자체 약관과 개인정보 보호정책에 따라 결제를 처리합니다. MING Wisdom Studio는 카드 정보나 스토어 결제 계정 정보를 받지 않습니다. 이 정책을 열 때는 브라우저와 GitHub Pages를, 지원 문의에는 사용자가 선택한 이메일 서비스를 이용하며 각각 자체 개인정보 보호정책이 적용됩니다.</p><p>이 페이지는 다음 방문에도 같은 언어를 표시하기 위해 브라우저의 로컬 저장소에 언어 선택만 저장하며, 해당 정보는 업로드하지 않습니다.</p><p>공유를 선택하면 MING은 캐시에 카드를 만든 뒤 Android 공유 창을 통해 선택한 앱에 전달합니다. MING이 직접 전송하지 않으며 선택한 서비스의 약관이 적용됩니다. 일반 공유 카드에는 저장된 이름과 출생 정보가 포함되지 않습니다. 수호신수 초대 QR에는 만남 별명, 수호신수 형태와 레벨, 유효 기간과 무작위 식별값이 담깁니다. 답장 결과 QR에는 받은 사람이 선택한 관계 상황과 확인할 주제도 담기지만 출생 정보는 포함되지 않습니다.</p>'],
          ['6. 수동 백업과 복원', '<p>MING은 Android 클라우드 백업과 자동 기기 이전을 사용하지 않습니다. 사용자가 내보내기를 선택한 경우에만 로컬 프로필, 기록, 수호신수 진행도와 설정이 담긴 구조화된 백업을 만들고 Android 시스템 문서 선택기로 저장 위치를 정하게 합니다. 가져오기는 사용자가 선택한 백업 파일만 읽고 형식을 확인한 뒤 복원합니다. MING은 이 파일을 업로드하지 않습니다. 선택한 클라우드 또는 저장 서비스에는 해당 서비스의 개인정보 보호정책이 적용되므로 내보낸 백업을 안전하게 보관하세요.</p>'],
          ['7. 보관과 삭제', '<p>인물 프로필, 점괘 기록과 운세 검증 일지는 고정 개수 제한 때문에 몰래 삭제되지 않으며 사용자가 삭제하거나 앱 저장 공간을 지우거나 앱을 제거할 때까지 남습니다. 수호신수 만남은 최근 20개만 보관합니다. 초대 QR은 만든 지 7일이 지나면 새 만남을 시작할 수 없지만 이미 만든 결과는 사라지지 않습니다. 기록이 끝없이 늘지 않도록 수호신수 완료 날짜는 최근 35일만 보관합니다. 이미 얻은 등급은 수호신수 또는 앱 데이터를 초기화하기 전까지 유지됩니다. “개인정보와 데이터” 화면에서 로컬 개인정보를 삭제할 수 있습니다. Pictures/MING에 저장한 이미지는 앱 전용 저장 공간 밖에 있으므로 갤러리에서 직접 삭제해야 합니다. 언어, 소리 및 개인정보 관련 설정은 앱 데이터를 모두 삭제하거나 MING을 제거할 때까지 유지됩니다.</p>'],
          ['8. 사용자의 선택과 권리', '<p>출생·관계 정보를 입력할지와 사용할 대운 진행 방향은 사용자가 정합니다. 앱에서 로컬 데이터를 확인, 수정, 내보내기, 가져오기 또는 삭제할 수 있습니다. MING은 이 정보를 개발자에게 전송하지 않으므로 개발자가 열람하거나 삭제할 서버 사본도 없습니다.</p>'],
          ['9. 문화 및 의사결정 안내', '<p>MING은 문화적 해석, 오락, 성찰을 위한 안내를 제공합니다. 의료 진단·치료, 법률·재정 조언, 정신건강 관리, 응급 서비스 또는 결과가 보장된 예측을 제공하거나 대신하지 않습니다. 안전 위험이 있는 경우 분실물이나 반려동물 찾기 안내는 현지 관계 기관에 연락하는 일을 대신할 수 없습니다.</p>'],
          ['10. 아동의 개인정보', '<p>MING은 아동을 특별히 대상으로 하지 않습니다. 앱은 아동이나 성인의 개인정보를 의도적으로 전송하지 않습니다. 보호자는 성찰 콘텐츠가 미성년자에게 적합한지 판단해야 합니다.</p>'],
          ['11. 보안 및 국제적 이용', '<p>로컬 정보는 Android 앱 샌드박스로 보호됩니다. 완전히 위험이 없는 저장 방식은 없으므로 기기와 내보낸 백업 접근을 안전하게 관리하세요. MING은 여러 국가에서 다운로드할 수 있지만 개발자 서버를 운영하지 않으며 앱 데이터를 국가 간에 전송하지 않습니다.</p>'],
          ['12. 정책 변경', '<p>앱의 동작이나 법적 요구사항이 변경되면 이 페이지의 날짜와 정책 버전을 갱신합니다. 데이터 처리 방식에 중대한 변경이 생기면 MING이 갱신된 정책을 다시 확인하도록 요청합니다.</p>'],
          ['13. 문의', '<p>개인정보 또는 지원 관련 문의는 ' + email + '으로 MING Wisdom Studio에 연락해 주세요.</p>']
        ]
      },
      de: {
        title: 'Datenschutzerklärung', app: 'MING: BaZi & Tageshoroskop', developer: 'Entwickler: MING Wisdom Studio', date: 'Gültig ab: 22. Juli 2026 · Zuletzt aktualisiert: 4. September 2026 · Version: 2026-09-04-samsung-v8',
        notice: 'MING verarbeitet Ihre Eingaben auf Ihrem Gerät. Die aktuelle App übermittelt dem Entwickler keine personenbezogenen Daten und verwendet weder Werbung noch Analyse-, Tracking- oder externe Absturzberichtsdienste.',
        sections: [
          ['1. Geltungsbereich', '<p>Diese Erklärung erläutert, wie MING Informationen verarbeitet, wenn Sie BaZi, vollständige Da-Yun-Zyklen, das I Ging, Tages-, Sieben-Tage-, Dreißig-Tage-, Monats- und Jahresrhythmen, die Wahl geeigneter Termine, Beziehungsdeutungen, den Östlichen Schutzgeist, Begegnungen der Schutzgeister, das Überprüfungstagebuch, Archive, die Teilen-Funktion und den Richtungskompass nutzen.</p>'],
          ['2. Auf Ihrem Gerät gespeicherte Informationen', '<p>MING speichert Informationen, die Sie eingeben oder sichern, im geschützten App-Speicher Ihres Geräts:</p><ul><li>Geburtsdatum, Geburtszeit oder die Angabe „Zeit unbekannt“, Geburtsort, Zeitzone, gewählte Tagesgrenze und die von Ihnen festgelegte Laufrichtung des Da Yun.</li><li>Namen und Geburtsangaben in gespeicherten Personen- und Beziehungsprofilen.</li><li>I-Ging-Befragungen, gewählter Fragekontext, Deutungen, Termine zur erneuten Prüfung und Reflexionsstatus.</li><li>Daten im Überprüfungstagebuch, ausgewählte Ergebnisse und Notizen, die Sie selbst verfassen.</li><li>Begegnungsname, Form und Stufe des Schutzgeists, zufällige QR-Kennung und Ablaufzeit, gewählter Beziehungskontext und Zweck sowie bis zu 20 aktuelle Begegnungs- oder zurückgesendete Ergebnisse.</li><li>Markierte Tagesübungen, Fortschritt des Schutzgeists und aktuelle Abschlussdaten, Sprache, Hintergrundmusik, haptische Rückmeldung, Navigationseinstellungen und die akzeptierte Fassung dieser Erklärung.</li></ul><p>Horoskope, Bewertungen, Deutungen, Terminempfehlungen, Ergebnisse des Schutzgeists, Begegnungen und das Lesen von QR-Codes werden auf Ihrem Gerät berechnet. Die mitgelieferten Schutzgeistbilder erfassen weder biometrische noch sonstige Bilddaten.</p>'],
          ['3. Keine externe Erfassung und kein Tracking', '<p>Die aktuelle Android-App besitzt keine Internetberechtigung. MING lädt die oben genannten Informationen nicht hoch und verwendet weder ein Kontosystem noch Werbe- oder Analyse-SDKs, Tracking-Technologien oder externe Absturzberichtsdienste. App-Daten werden von uns weder verkauft noch weitergegeben.</p>'],
          ['4. Sensoren, Fotos und Berechtigungen', '<p>Der Richtungskompass verarbeitet die Werte des Orientierungssensors nur im Arbeitsspeicher und nur solange der Kompass angezeigt wird. Die Messwerte werden weder gespeichert noch übertragen. MING fordert keinen Zugriff auf GPS-Standort, Mikrofon, Kamera, Kontakte, Kalender, Telefon, SMS oder die gesamte Foto- beziehungsweise Dateisammlung an.</p><p>Wenn Sie einen Schutzgeist-QR-Code aus Ihrer Galerie lesen, wählen Sie über die Android-Dateiauswahl genau ein Bild aus. MING liest nur dieses Bild und verarbeitet es offline. Beim Speichern einer erstellten Karte legt Android die PNG-Datei unter Pictures/MING ab; dort bleibt sie, bis Sie sie selbst löschen.</p><p>Die Hintergrundmusik stammt aus einer in der App enthaltenen Audiodatei und verwendet nicht das Mikrofon.</p>'],
          ['5. Kostenpflichtiger Download, Teilen und Drittanbieter', '<p>Wenn Sie MING über einen App-Store kaufen, verarbeitet der Store die Transaktion nach seinen eigenen Bedingungen und Datenschutzregeln. MING Wisdom Studio erhält weder Ihre Karten- noch Ihre Store-Zugangsdaten. Beim Öffnen dieser Erklärung werden Ihr Browser und GitHub Pages genutzt; für eine Supportanfrage verwenden Sie Ihren gewählten E-Mail-Dienst. Es gelten jeweils die Datenschutzbestimmungen dieser Dienste.</p><p>Diese Seite speichert ausschließlich Ihre Sprachauswahl im lokalen Speicher Ihres Browsers, damit beim nächsten Aufruf dieselbe Sprache angezeigt wird. Diese Auswahl wird nicht hochgeladen.</p><p>Erst wenn Sie „Teilen“ wählen, erstellt MING eine Karte im Zwischenspeicher und übergibt sie über das Android-Teilen-Menü an die von Ihnen ausgewählte App. MING versendet die Karte nicht selbst; für den gewählten Dienst gelten dessen eigene Bedingungen. Gewöhnliche Teilen-Karten enthalten grundsätzlich keine gespeicherten Namen oder Geburtsangaben. Ein Einladungs-QR-Code enthält nur Begegnungsname, Form und Stufe des Schutzgeists, Ablaufzeit und eine zufällige Kennung. Ein Ergebnis-QR-Code enthält zusätzlich den vom Empfänger gewählten Beziehungskontext und Zweck, jedoch keine Geburtsangaben.</p>'],
          ['6. Manuelle Sicherung und Wiederherstellung', '<p>MING deaktiviert die Android-Cloud-Sicherung und die automatische Geräteübertragung. Nur wenn Sie „Exportieren“ wählen, erstellt MING eine strukturierte Sicherungsdatei mit lokalen Profilen, Aufzeichnungen, Fortschritt des Schutzgeists und Einstellungen. Den Speicherort wählen Sie über die Android-Dateiauswahl. Beim Import liest MING nur die von Ihnen gewählte Datei und prüft ihr Format vor der Wiederherstellung. MING lädt diese Dateien nicht hoch. Wenn Sie einen Cloud- oder Speicherdienst auswählen, verarbeitet dieser die Datei nach seinen eigenen Datenschutzbestimmungen. Bewahren Sie exportierte Sicherungen daher sicher auf.</p>'],
          ['7. Speicherdauer und Löschung', '<p>Profile, I-Ging-Befragungen und Einträge im Überprüfungstagebuch werden nicht aufgrund einer festen Höchstzahl unbemerkt gelöscht. Sie bleiben gespeichert, bis Sie sie löschen, den App-Speicher leeren oder MING deinstallieren. Für Schutzgeist-Begegnungen werden die 20 neuesten Einträge aufbewahrt. Sieben Tage nach Erstellung kann ein Einladungs-QR-Code keine neue Begegnung mehr starten; bereits abgeschlossene Ergebnisse verfallen dadurch nicht. Damit die Aktivitätsliste nicht unbegrenzt wächst, werden Abschlussdaten des Schutzgeists für die letzten 35 Tage gespeichert. Eine erreichte Stufe bleibt erhalten, bis die Schutzgeist- oder App-Daten zurückgesetzt werden. Unter „Datenschutz & Daten“ können Sie lokale personenbezogene Daten löschen. Unter Pictures/MING gespeicherte Bilder liegen außerhalb des geschützten App-Speichers und müssen in Ihrer Galerie gelöscht werden. Sprach-, Ton- und Datenschutzeinstellungen bleiben erhalten, bis der gesamte App-Speicher gelöscht oder MING deinstalliert wird.</p>'],
          ['8. Ihre Wahlmöglichkeiten und Rechte', '<p>Sie entscheiden selbst, ob Sie Geburts- oder Beziehungsangaben eingeben und welche Laufrichtung des Da Yun verwendet wird. Lokale Daten können Sie in der App ansehen, ändern, exportieren, importieren oder löschen. Da MING diese Informationen nicht an uns übermittelt, besitzt der Entwickler keine serverseitige Kopie, die eingesehen oder gelöscht werden könnte.</p>'],
          ['9. Hinweis zu Kultur und Entscheidungen', '<p>MING bietet kulturelle Deutungen, Unterhaltung und Anregungen zur Selbstreflexion. Die App bietet und ersetzt keine medizinische Diagnose oder Behandlung, Rechts- oder Finanzberatung, psychologische Versorgung, Notfalldienste oder garantierte Vorhersagen. Bei Sicherheitsrisiken ersetzen Hinweise zu verlorenen Gegenständen oder Haustieren nicht die Kontaktaufnahme mit den zuständigen örtlichen Stellen.</p>'],
          ['10. Datenschutz von Kindern', '<p>MING richtet sich nicht ausdrücklich an Kinder. Die App übermittelt wissentlich weder personenbezogene Daten von Kindern noch von Erwachsenen. Eltern und Erziehungsberechtigte sollten selbst beurteilen, ob die Reflexionsinhalte für Minderjährige geeignet sind.</p>'],
          ['11. Sicherheit und internationale Nutzung', '<p>Lokale Informationen werden durch die App-Sandbox von Android geschützt. Keine Speichermethode ist völlig risikofrei. Schützen Sie daher den Zugriff auf Ihr Gerät und auf exportierte Sicherungen. MING kann in mehreren Ländern heruntergeladen werden, betreibt jedoch keinen Entwicklerserver und überträgt keine App-Daten über Landesgrenzen hinweg.</p>'],
          ['12. Änderungen dieser Erklärung', '<p>Wenn sich das Verhalten der App oder rechtliche Anforderungen ändern, aktualisieren wir diese Seite mit einem neuen Datum und einer neuen Versionsnummer. Wirkt sich eine Änderung wesentlich auf die Datenverarbeitung in der App aus, bittet MING Sie erneut, die aktualisierte Erklärung zu prüfen.</p>'],
          ['13. Kontakt', '<p>Bei Fragen zu Datenschutz oder Support erreichen Sie MING Wisdom Studio unter ' + email + '.</p>']
        ]

      ja: {
        title: 'プライバシーポリシー', app: 'MING 四柱推命・今日の運勢', developer: '開発者：MING Wisdom Studio', date: '施行日：2026年7月22日 · 更新日：2026年9月4日 · バージョン：2026-09-04-samsung-v8',
        notice: 'MINGは、入力された情報を端末内で処理します。現在のアプリが個人データを開発者へ送信することはなく、広告、アクセス解析、トラッキング、外部のクラッシュレポートサービスも使用しません。',
        sections: [
          ['1. 適用範囲', '<p>本ポリシーは、MINGの四柱推命、すべての大運、易経、今日・7日間・30日間・月間・年間の運勢、目的別の吉日選び、相性診断、東方の守護獣、守護獣との出会い、運勢検証日記、履歴、共有機能、方位コンパスを利用する際に、情報がどのように取り扱われるかを説明するものです。</p>'],
          ['2. 端末内に保存される情報', '<p>MINGは、利用者が入力または保存した次の情報を、端末内のアプリ専用領域に保存します。</p><ul><li>生年月日、出生時刻または「時刻不明」の選択、出生地、タイムゾーン、日付の切り替え基準、選択した大運の進行方向。</li><li>本人および相性診断用プロフィールに保存した名前と出生情報。</li><li>易経の占断履歴、選択した相談内容、解釈、見直し日、振り返りの状態。</li><li>運勢検証日記の日付、選択した検証結果、利用者が入力したメモ。</li><li>出会い用のニックネーム、守護獣の姿とレベル、QRのランダム識別子と有効期限、選択した関係性と目的、直近20件までの出会いまたは返送結果。</li><li>記録した今日の実践、守護獣の成長状況と最近の完了日、言語、BGM、振動、画面移動の設定、同意済みのポリシーバージョン。</li></ul><p>命式、スコア、解釈、吉日選びの結果、守護獣の結果、守護獣との出会い、QRの読み取りは、すべて端末内で処理されます。アプリに収録された守護獣の画像が、生体情報や画像データを収集することはありません。</p>'],
          ['3. 外部への収集・トラッキングなし', '<p>現在のAndroidアプリにはインターネット権限がありません。MINGが上記の情報をアップロードすることはなく、アカウント機能、広告SDK、解析SDK、トラッキング技術、外部のクラッシュレポートサービスも使用しません。アプリ内のデータを販売または第三者と共有することもありません。</p>'],
          ['4. センサー、画像、権限', '<p>方位コンパスは、その画面を表示している間だけ、端末の方位センサーの値をメモリ上で処理します。測定値は保存も送信もされません。MINGは、GPSによる位置情報、マイク、カメラ、連絡先、カレンダー、電話、SMS、写真ライブラリ全体またはストレージ全体へのアクセス権限を求めません。</p><p>ギャラリーにある守護獣のQRを読み取る場合は、Androidのシステムファイル選択画面で画像を1枚だけ選びます。MINGが読み取るのはその画像だけで、処理はオフラインで行われます。作成したカードを保存すると、AndroidがPNGファイルをPictures/MINGに保存します。このファイルは利用者が削除するまで残ります。</p><p>BGMはアプリに収録された音声ファイルを再生するもので、マイクは使用しません。</p>'],
          ['5. 有料ダウンロード、共有、外部サービス', '<p>アプリストアでMINGを購入した場合、決済はそのストアの利用規約とプライバシーポリシーに基づいて処理されます。MING Wisdom Studioがクレジットカード情報やストアアカウントの認証情報を受け取ることはありません。本ポリシーを開く際はブラウザとGitHub Pagesを、サポートへの連絡には利用者が選んだメールサービスを使用し、それぞれのプライバシーポリシーが適用されます。</p><p>本ページは、次回も同じ言語で表示するため、選択した言語だけをブラウザのローカルストレージに保存します。この情報がアップロードされることはありません。</p><p>利用者が「共有」を選んだときに限り、MINGはキャッシュ内にカードを作成し、Androidの共有画面を通じて選択されたアプリへ渡します。MINGがカードを自動送信することはなく、選択したサービスの規約が適用されます。通常の共有カードには、保存された名前や出生情報が含まれません。守護獣の招待QRに含まれるのは、出会い用のニックネーム、守護獣の姿とレベル、有効期限、ランダム識別子です。結果返送用QRには、受け取った人が選択した関係性と目的も含まれますが、出生情報は含まれません。</p>'],
          ['6. 手動バックアップと復元', '<p>MINGは、Androidのクラウドバックアップと端末間の自動移行を無効にしています。利用者が「エクスポート」を選んだ場合に限り、ローカルのプロフィール、履歴、守護獣の成長状況、設定を含むバックアップファイルを作成し、Androidのシステムファイル選択画面で保存先を指定できるようにします。「インポート」では、利用者が選択したバックアップファイルだけを読み込み、形式を確認してから復元します。MINGがこれらのファイルをアップロードすることはありません。クラウドやストレージサービスを保存先に選んだ場合は、そのサービスのプライバシーポリシーに基づいて処理されるため、書き出したバックアップは安全に保管してください。</p>'],
          ['7. 保存期間と削除', '<p>プロフィール、易経の占断履歴、運勢検証日記は、件数の上限によって自動的に削除されることはありません。利用者が削除するか、アプリのストレージを消去するか、MINGをアンインストールするまで保存されます。守護獣との出会いは直近20件まで保存されます。招待QRは作成から7日を過ぎると新しい出会いを始められなくなりますが、完了済みの結果が消えることはありません。行動履歴が増え続けないよう、守護獣の完了日は直近35日分のみ保存されます。獲得したレベルは、守護獣またはアプリのデータをリセットするまで維持されます。「プライバシーとデータ」画面では、端末内の個人データを削除できます。Pictures/MINGに保存した画像はアプリ専用領域の外にあるため、ギャラリーから削除してください。言語、音、プライバシーの設定は、アプリの全データを消去するかMINGをアンインストールするまで残ります。</p>'],
          ['8. 利用者の選択と権利', '<p>出生情報や関係性の情報を入力するかどうか、どちらの大運の進行方向を採用するかは、利用者自身が選べます。端末内のデータは、アプリから確認、変更、エクスポート、インポート、削除できます。MINGはこれらの情報を開発者へ送信しないため、開発者が開示または削除できるサーバー上のコピーもありません。</p>'],
          ['9. 文化的解釈と意思決定に関する注意', '<p>MINGは、東洋文化に基づく解釈、娯楽、自己を振り返るための参考情報を提供します。医療上の診断や治療、法律・金融に関する助言、心のケア、緊急サービス、結果を保証する予測を提供するものではなく、それらに代わるものでもありません。安全上の懸念がある場合、紛失物や迷子のペットに関する案内は、地域の関係機関への連絡に代わるものではありません。</p>'],
          ['10. 子どものプライバシー', '<p>MINGは、子どもを主な対象とするアプリではありません。子ども・大人を問わず、個人情報を意図的に送信することはありません。保護者は、自己を振り返るための内容が未成年者に適しているかをご自身で判断してください。</p>'],
          ['11. セキュリティと海外での利用', '<p>端末内の情報は、Androidのアプリサンドボックスによって保護されます。ただし、完全にリスクのない保存方法はありません。端末と書き出したバックアップへのアクセスを適切に管理してください。MINGは複数の国でダウンロードできますが、開発者のサーバーを運用しておらず、アプリ内のデータを国境を越えて転送することもありません。</p>'],
          ['12. 本ポリシーの変更', '<p>アプリの動作または法的要件が変わった場合は、このページの更新日とバージョンを改めます。アプリ内のデータ処理に重大な変更がある場合、MINGは更新後のポリシーを改めて確認するよう求めます。</p>'],
          ['13. お問い合わせ', '<p>プライバシーまたはサポートに関するお問い合わせは、' + email + ' までMING Wisdom Studioへご連絡ください。</p>']
        ]
      }
    };

    function render(lang) {
      const selected = copy[lang] || copy.en;
      document.documentElement.lang = lang;
      document.title = selected.title + ' · MING';
      document.getElementById('policy').innerHTML =
        '<div class="eyebrow">MING · PRIVACY</div>' +
        '<h1>' + selected.title + '</h1>' +
        '<p class="meta">' + selected.app + '</p>' +
        '<p class="meta">' + selected.developer + '</p>' +
        '<p class="meta">' + selected.date + '</p>' +
        '<div class="notice">' + selected.notice + '</div>' +
        selected.sections.map(([title, body]) => '<section><h2>' + title + '</h2>' + body + '</section>').join('');
      document.querySelectorAll('[data-lang]').forEach(button => {
        button.setAttribute('aria-pressed', String(button.dataset.lang === lang));
      });
      localStorage.setItem('ming-privacy-language', lang);
    }

    document.querySelectorAll('[data-lang]').forEach(button => button.addEventListener('click', () => render(button.dataset.lang)));
    const browserLanguage = navigator.language || 'en';
    const automatic = browserLanguage.startsWith('zh') ? (browserLanguage.includes('TW') || browserLanguage.includes('HK') || browserLanguage.includes('Hant') ? 'zh-Hant' : 'zh-Hans') : browserLanguage.startsWith('fr') ? 'fr' : browserLanguage.startsWith('ko') ? 'ko' : browserLanguage.startsWith('de') ? 'de' : browserLanguage.startsWith('ja') ? 'ja' : 'en';
    render(localStorage.getItem('ming-privacy-language') || automatic);
  </script>
</body>
</html>
